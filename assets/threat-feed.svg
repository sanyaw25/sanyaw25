      <text x="40" y="34" font-family="Courier New, monospace" font-size="14" fill="#F5EFE6"><tspan fill="#B76E79">●</tspan> <tspan fill="#C9A24B">CVE-2026-74851</tspan> <tspan fill="#F5EFE6">The Pods WordPress plugin before 3.3.9.1 does not correctly compare a display callback aga</tspan></text><text x="986" y="34" font-family="Courier New, monospace" font-size="14" fill="#F5EFE6"><tspan fill="#B76E79">●</tspan> <tspan fill="#C9A24B">CVE-2026-58097</tspan> <tspan fill="#F5EFE6">mp_SetEnddisc() copied a user-supplied PSN endpoint value without length validation, allow</tspan></text><text x="1932" y="34" font-family="Courier New, monospace" font-size="14" fill="#F5EFE6"><tspan fill="#B76E79">●</tspan> <tspan fill="#C9A24B">CVE-2026-58096</tspan> <tspan fill="#F5EFE6">LcpDecodeConfig() did not validate the length of received endpoint discriminator options a</tspan></text><text x="2878" y="34" font-family="Courier New, monospace" font-size="14" fill="#F5EFE6"><tspan fill="#B76E79">●</tspan> <tspan fill="#C9A24B">CVE-2026-58095</tspan> <tspan fill="#F5EFE6">mp_Enddisc() used incorrect length calculations when formatting endpoint discriminator add</tspan></text><text x="3824" y="34" font-family="Courier New, monospace" font-size="14" fill="#F5EFE6"><tspan fill="#B76E79">●</tspan> <tspan fill="#C9A24B">CVE-2026-58094</tspan> <tspan fill="#F5EFE6">The FIOSSHMLPGCNF ioctl(2) operation configures the page size for a largepage shared memor</tspan></text><text x="4770" y="34" font-family="Courier New, monospace" font-size="14" fill="#F5EFE6"><tspan fill="#B76E79">●</tspan> <tspan fill="#C9A24B">CVE-2026-58093</tspan> <tspan fill="#F5EFE6">The TIOCSCTTY ioctl handler drops the tty lock in order to acquire the process tree lock. </tspan></text>
      <g transform="translate(5716,0)">
        <text x="40" y="34" font-family="Courier New, monospace" font-size="14" fill="#F5EFE6"><tspan fill="#B76E79">●</tspan> <tspan fill="#C9A24B">CVE-2026-74851</tspan> <tspan fill="#F5EFE6">The Pods WordPress plugin before 3.3.9.1 does not correctly compare a display callback aga</tspan></text><text x="986" y="34" font-family="Courier New, monospace" font-size="14" fill="#F5EFE6"><tspan fill="#B76E79">●</tspan> <tspan fill="#C9A24B">CVE-2026-58097</tspan> <tspan fill="#F5EFE6">mp_SetEnddisc() copied a user-supplied PSN endpoint value without length validation, allow</tspan></text><text x="1932" y="34" font-family="Courier New, monospace" font-size="14" fill="#F5EFE6"><tspan fill="#B76E79">●</tspan> <tspan fill="#C9A24B">CVE-2026-58096</tspan> <tspan fill="#F5EFE6">LcpDecodeConfig() did not validate the length of received endpoint discriminator options a</tspan></text><text x="2878" y="34" font-family="Courier New, monospace" font-size="14" fill="#F5EFE6"><tspan fill="#B76E79">●</tspan> <tspan fill="#C9A24B">CVE-2026-58095</tspan> <tspan fill="#F5EFE6">mp_Enddisc() used incorrect length calculations when formatting endpoint discriminator add</tspan></text><text x="3824" y="34" font-family="Courier New, monospace" font-size="14" fill="#F5EFE6"><tspan fill="#B76E79">●</tspan> <tspan fill="#C9A24B">CVE-2026-58094</tspan> <tspan fill="#F5EFE6">The FIOSSHMLPGCNF ioctl(2) operation configures the page size for a largepage shared memor</tspan></text><text x="4770" y="34" font-family="Courier New, monospace" font-size="14" fill="#F5EFE6"><tspan fill="#B76E79">●</tspan> <tspan fill="#C9A24B">CVE-2026-58093</tspan> <tspan fill="#F5EFE6">The TIOCSCTTY ioctl handler drops the tty lock in order to acquire the process tree lock. </tspan></text>
