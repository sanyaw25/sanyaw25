<svg viewBox="0 0 1200 60" width="100%" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="traceGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="10%" stop-color="#B76E79" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#C9A24B" stop-opacity="0.85"/>
      <stop offset="90%" stop-color="#B76E79" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5EFE6" stop-opacity="1"/>
      <stop offset="40%" stop-color="#C9A24B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <path d="M0,30 L520,30 L545,12 L570,48 L595,12 L620,48 L645,30 L1200,30"
        fill="none" stroke="url(#traceGrad)" stroke-width="1.4"/>

  <g fill="#0D1117" stroke="#C9A24B" stroke-width="1.2">
    <circle cx="150" cy="30" r="4"/>
    <circle cx="350" cy="30" r="4"/>
    <circle cx="850" cy="30" r="4"/>
    <circle cx="1050" cy="30" r="4"/>
  </g>
  <g fill="#C9A24B">
    <circle cx="150" cy="30" r="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="30" r="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="0.85s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="30" r="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="2.35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="30" r="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="3.05s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(582,30)" stroke="#F5EFE6" stroke-width="1.3" fill="none">
    <rect x="-7" y="-2" width="14" height="11" rx="1.5"/>
    <path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4"/>
    <circle cx="0" cy="3.5" r="1.1" fill="#C9A24B" stroke="none">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle r="4.5" fill="url(#pulseGlow)">
    <animateMotion dur="5s" repeatCount="indefinite"
      path="M0,30 L520,30 L545,12 L570,48 L595,12 L620,48 L645,30 L1200,30"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.96;1" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
