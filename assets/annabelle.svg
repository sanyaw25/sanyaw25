<animateTransform
attributeName="transform"
type="rotate"
values="
0 505 230;
2 505 230;
-1 505 230;
0 505 230"
dur="10s"
repeatCount="indefinite"/>

</path>

<path
d="M640 238
Q695 195
750 235"
stroke="#0d0703"
