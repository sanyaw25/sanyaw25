<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 700"
     width="1200"
     height="700">

<defs>

<radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
<stop offset="0%" stop-color="#140f12" stop-opacity="0.8"/>
<stop offset="50%" stop-color="#050304" stop-opacity="0.95"/>
<stop offset="100%" stop-color="#000000"/>
</radialGradient>

<radialGradient id="crimsonAura" cx="50%" cy="30%" r="50%">
<stop offset="0%" stop-color="#4a0004" stop-opacity=".25"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>

<linearGradient id="porcelainSkin"
x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#e8dfd1"/>
<stop offset="40%" stop-color="#b0a494"/>
<stop offset="75%" stop-color="#4a423a"/>
<stop offset="100%" stop-color="#0d0a08"/>
</linearGradient>

<radialGradient id="socketShadow">
<stop offset="0%" stop-color="#000000"/>
<stop offset="80%" stop-color="#080002"/>
<stop offset="100%" stop-color="#1a0207" stop-opacity="0"/>
</radialGradient>

<radialGradient id="annabelleIris">
<stop offset="0%" stop-color="#a3b8cc"/>
<stop offset="25%" stop-color="#486581"/>
<stop offset="65%" stop-color="#102a43"/>
<stop offset="90%" stop-color="#060c12"/>
<stop offset="100%" stop-color="#400000"/>
</radialGradient>

<filter id="softShadow"
x="-30%" y="-30%"
width="160%" height="160%">
<feDropShadow dx="-10"
dy="18"
stdDeviation="18"
flood-color="#000000"
flood-opacity=".95"/>
</filter>

<filter id="eyeGlow">
<feGaussianBlur stdDeviation="5" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<clipPath id="leftSocketClip">
<ellipse cx="505" cy="275" rx="42" ry="38"/>
</clipPath>

<clipPath id="rightSocketClip">
<ellipse cx="695" cy="275" rx="42" ry="38"/>
</clipPath>

</defs>

<rect width="1200" height="700" fill="#000"/>

<rect width="1200"
height="700"
fill="url(#bgGlow)"/>

<circle
cx="600"
cy="300"
r="400"
fill="url(#crimsonAura)"
opacity=".22">

<animate
attributeName="opacity"
values=".15;.32;.18;.28;.15"
dur="4s"
repeatCount="indefinite"/>

<animate
attributeName="r"
values="392;410;396;405;392"
dur="7s"
repeatCount="indefinite"/>

</circle>

<ellipse
cx="600"
cy="680"
rx="450"
ry="45"
fill="#000"
opacity=".98"/>

<g id="doll">

<animateTransform
attributeName="transform"
type="translate"
values="
0 0;
0 -4;
0 0;
0 3;
0 0"
dur="6s"
repeatCount="indefinite"/>

<animateTransform
attributeName="transform"
additive="sum"
type="rotate"
values="
0 600 320;
1 600 320;
-1 600 320;
0 600 320"
dur="10s"
repeatCount="indefinite"/>

<g id="bodyGroup">

<path
d="M320 720
C375 485 480 425 600 425
C720 425 825 485 880 720 Z"
fill="#2b2622"
stroke="#0a0807"
stroke-width="2"
filter="url(#softShadow)"/>

<path
d="M360 720
C410 520
490 450
600 450
C710 450
790 520
840 720 Z"
fill="#423b35"
stroke="#171310"
stroke-width="2"/>

<path
d="M470 510
Q600 540
730 510
Q600 565
470 510 Z"
fill="#4a080f"
opacity=".9"/>

<circle
cx="600"
cy="532"
r="14"
fill="#300307">

<animate
attributeName="r"
values="14;15;14"
dur="3s"
repeatCount="indefinite"/>

</circle>

<path
d="M480 425
Q600 465
720 425
Q600 440
480 425 Z"
fill="#5e5449"
opacity=".8"/>

<rect
x="560"
y="365"
width="80"
height="60"
rx="15"
fill="#171310"
stroke="#050403"
stroke-width="3"/>

</g>

<g id="headGroup">

<animateTransform
attributeName="transform"
type="rotate"
values="
0 600 320;
4 600 320;
-5 600 320;
2 600 320;
0 600 320"
dur="9s"
repeatCount="indefinite"/>

<path
d="M450 220
C370 280
320 450
270 590
C250 610
290 620
310 580
C350 460
410 320
460 250 Z"
fill="#1c1008"/>

<path
d="M300 500
Q270 510
290 540 Z"
fill="#5c0a13"/>

<path
d="M750 220
C830 280
880 450
930 590
C950 610
910 620
890 580
C850 460
790 320
740 250 Z"
fill="#1c1008"/>

<path
d="M900 500
Q930 510
910 540 Z"
fill="#5c0a13"/>

<ellipse
cx="600"
cy="265"
rx="148"
ry="160"
fill="url(#porcelainSkin)"
filter="url(#softShadow)"/>

<!-- CHEEKS -->

<ellipse
cx="490"
cy="315"
rx="36"
ry="26"
fill="#3a0008"
opacity=".45">

<animate
attributeName="opacity"
values=".35;.55;.4;.5;.35"
dur="5s"
repeatCount="indefinite"/>

</ellipse>

<ellipse
cx="710"
cy="315"
rx="36"
ry="26"
fill="#3a0008"
opacity=".45">

<animate
attributeName="opacity"
values=".45;.55;.42;.5;.45"
dur="5s"
repeatCount="indefinite"/>

</ellipse>

<!-- JAW -->

<g id="jawGroup">

<animateTransform
attributeName="transform"
type="translate"
values="
0 0;
0 4;
0 10;
0 2;
0 0"
dur="8s"
repeatCount="indefinite"/>

<path
d="M535 355
Q600 350
665 355
Q600 410
535 355 Z"
fill="#000000"/>

<path
d="M530 358
Q600 405
670 358
Q600 375
530 358 Z"
fill="#3b020a"/>

</g>

<path
d="M530 358
Q600 340
670 358
Q600 355
530 358 Z"
fill="#4a040f"/>

<!-- CRACKS -->

<g
stroke="#140f0c"
stroke-linecap="round"
stroke-linejoin="round"
fill="none">

<path
d="M575 110
L590 145
L565 175
L600 210
L585 235"
stroke-width="2.5"/>

<path
d="M590 145
L615 155
M565 175
L540 180"
stroke-width="1.2"
opacity=".7"/>

<path
d="M490 235
L455 275
L475 315
L440 360"
stroke-width="2"/>

<path
d="M700 295
L735 320
L715 350"
stroke-width="2"/>

</g>

<!-- EYE SOCKETS -->

<ellipse
cx="505"
cy="275"
rx="46"
ry="42"
fill="url(#socketShadow)"/>

<ellipse
cx="695"
cy="275"
rx="46"
ry="42"
fill="url(#socketShadow)"/>

<!-- LEFT EYE -->

<g clip-path="url(#leftSocketClip)">

<g id="leftEye">

<animateTransform
attributeName="transform"
type="translate"
values="
505 275;
510 273;
501 277;
507 272;
505 275"
dur="6s"
repeatCount="indefinite"/>

<circle
cx="0"
cy="0"
r="32"
fill="#d9d2c5"/>

<circle
cx="0"
cy="0"
r="22"
fill="url(#annabelleIris)"/>

<circle
cx="0"
cy="0"
r="6"
fill="#000">

<animate
attributeName="r"
values="
6;
4;
7;
5;
6"
dur="5s"
repeatCount="indefinite"/>

</circle>

<circle
cx="0"
cy="0"
r="1.5"
fill="#ff0000"
filter="url(#eyeGlow)">

<animate
attributeName="opacity"
values="
.4;
1;
.5;
1;
.4"
dur="4s"
repeatCount="indefinite"/>

</circle>

<circle
cx="-7"
cy="-7"
r="5"
fill="#fff"
opacity=".6"/>

<!-- blink -->

<ellipse
cx="0"
cy="0"
rx="32"
ry="32"
fill="#b8aa9b">

<animate
attributeName="ry"
values="
32;
32;
2;
32;
32"
dur="7s"
repeatCount="indefinite"/>

</ellipse>

</g>

</g>

<!-- RIGHT EYE -->

<g clip-path="url(#rightSocketClip)">

<g id="rightEye">

<animateTransform
attributeName="transform"
type="translate"
values="
695 275;
690 272;
699 276;
693 273;
695 275"
dur="6.2s"
repeatCount="indefinite"/>

<circle
cx="0"
cy="0"
r="32"
fill="#d9d2c5"/>

<circle
cx="0"
cy="0"
r="22"
fill="url(#annabelleIris)"/>

<circle
cx="0"
cy="0"
r="6"
fill="#000">

<animate
attributeName="r"
values="
6;
5;
7;
4;
6"
dur="5.5s"
repeatCount="indefinite"/>

</circle>

<circle
cx="0"
cy="0"
r="1.5"
fill="#ff0000"
filter="url(#eyeGlow)">

<animate
attributeName="opacity"
values="
.5;
1;
.3;
1;
.5"
dur="4.3s"
repeatCount="indefinite"/>

</circle>

<circle
cx="-7"
cy="-7"
r="5"
fill="#fff"
opacity=".6"/>

<ellipse
cx="0"
cy="0"
rx="32"
ry="32"
fill="#b8aa9b">

<animate
attributeName="ry"
values="
32;
32;
2;
32;
32"
dur="7.3s"
repeatCount="indefinite"/>

</ellipse>

</g>

</g>
