stroke-linecap="round">

<animateTransform
attributeName="transform"
type="rotate"
values="
0 695 230;
-2 695 230;
1 695 230;
0 695 230"
dur="10s"
repeatCount="indefinite"/>

</path>

<!-- NOSE -->

<path
d="M596 258
L588 308
Q600 316
612 308
L604 258"
fill="none"
stroke="#2b2118"
stroke-width="2"
stroke-linejoin="round"/>

<!-- HAIR FRINGE -->

<path
d="M450 165
Q600 115
750 165
Q715 105
600 100
Q485 105
450 165 Z"
fill="#1c1008">

<animateTransform
attributeName="transform"
type="rotate"
values="
0 600 150;
1 600 150;
-1 600 150;
0 600 150"
dur="8s"
repeatCount="indefinite"/>

</path>

</g>

<!-- FLOATING DUST -->

<g fill="#ffffff" opacity=".18">

<circle cx="180" cy="620" r="1">
<animate attributeName="cy"
values="620;0"
dur="14s"
repeatCount="indefinite"/>
</circle>

<circle cx="330" cy="700" r="1.5">
<animate attributeName="cy"
values="700;-10"
dur="18s"
repeatCount="indefinite"/>
</circle>

<circle cx="520" cy="650" r="1">
<animate attributeName="cy"
values="650;-20"
dur="15s"
repeatCount="indefinite"/>
</circle>

<circle cx="720" cy="680" r="1.2">
<animate attributeName="cy"
values="680;-10"
dur="16s"
repeatCount="indefinite"/>
</circle>

<circle cx="930" cy="700" r="1">
<animate attributeName="cy"
values="700;0"
dur="17s"
repeatCount="indefinite"/>
</circle>

</g>

<!-- CREEPY TEXT -->

<text
x="600"
y="655"
text-anchor="middle"
font-size="28"
font-family="Georgia"
letter-spacing="6"
fill="#5a4b41"
opacity=".6">

<tspan>I MISSED YOU...</tspan>

<animate
attributeName="opacity"
values=".15;.7;.2;.6;.15"
dur="6s"
repeatCount="indefinite"/>

</text>

<!-- SCREEN FLICKER -->

<rect
width="1200"
height="700"
fill="#ffffff"
opacity="0">

<animate
attributeName="opacity"
values="
0;
0;
0.03;
0;
0.06;
0;
0"
dur=".25s"
repeatCount="indefinite"/>

</rect>

</g>

</svg>
