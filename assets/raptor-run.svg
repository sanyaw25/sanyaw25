<svg width="100%" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <style>
    .leg-f { animation: legF 0.28s ease-in-out infinite alternate; transform-origin: 0px 0px; }
    .leg-b { animation: legB 0.28s ease-in-out infinite alternate; transform-origin: 0px 0px; }
    @keyframes legF { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
    @keyframes legB { from { transform: rotate(22deg); } to { transform: rotate(-22deg); } }
    #raptor-head { animation: headbob 0.28s ease-in-out infinite alternate; transform-origin: 0px 0px; }
    @keyframes headbob { from { transform: translateY(0px) rotate(0deg); } to { transform: translateY(-2px) rotate(-4deg); } }
    #raptor-tail { animation: tailswish 0.28s ease-in-out infinite alternate; transform-origin: 0px 0px; }
    @keyframes tailswish { from { transform: rotate(6deg); } to { transform: rotate(-6deg); } }
  </style>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-40,0; 940,0" keyTimes="0;1" dur="2.2s" repeatCount="indefinite"/>

    <g transform="translate(0,70) scale(1.1)">
      <!-- tail -->
      <path id="raptor-tail" d="M-8,0 Q-40,-4 -55,-16" stroke="#FF1493" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- back leg -->
      <g class="leg-b" transform="translate(-2,10)">
        <rect x="-3" y="0" width="6" height="16" rx="2" fill="#C71585"/>
        <rect x="-3" y="14" width="10" height="4" rx="1.5" fill="#C71585"/>
      </g>
      <!-- front leg -->
      <g class="leg-f" transform="translate(10,10)">
        <rect x="-3" y="0" width="6" height="16" rx="2" fill="#C71585"/>
        <rect x="-3" y="14" width="10" height="4" rx="1.5" fill="#C71585"/>
      </g>
      <!-- body -->
      <ellipse cx="0" cy="0" rx="20" ry="11" fill="#FF69B4"/>
      <!-- small arms -->
      <rect x="10" y="-2" width="9" height="3" rx="1.5" fill="#FF1493" transform="rotate(15 10 -2)"/>
      <!-- neck + head -->
      <g id="raptor-head" transform="translate(18,-8)">
        <path d="M0,0 Q10,-14 24,-10 L26,-4 Q14,-2 4,4 Z" fill="#FF69B4"/>
        <polygon points="24,-10 30,-9 25,-5" fill="#FFD700"/>
        <circle cx="16" cy="-9" r="1.6" fill="#2b2b2b"/>
      </g>
      <!-- gold spine spikes, barbie sparkle -->
      <polygon points="-14,-9 -12,-14 -10,-9" fill="#FFD700"/>
      <polygon points="-4,-10 -2,-16 0,-10" fill="#FFD700"/>
      <polygon points="6,-10 8,-15 10,-10" fill="#FFD700"/>
    </g>
  </g>
</svg>
