name: refresh threat feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate threat-feed.svg
        run: python3 scripts/generate_threat_feed.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/threat-feed.svg
          git diff --staged --quiet || git commit -m "chore: refresh live threat feed"
          git push
