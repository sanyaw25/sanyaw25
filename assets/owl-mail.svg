<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .wing-l { animation: flapL 0.35s ease-in-out infinite alternate; transform-origin: 0px 0px; }
    .wing-r { animation: flapR 0.35s ease-in-out infinite alternate; transform-origin: 0px 0px; }
    @keyframes flapL { from { transform: rotate(-25deg); } to { transform: rotate(15deg); } }
    @keyframes flapR { from { transform: rotate(25deg); } to { transform: rotate(-15deg); } }
    #letter {
      opacity: 0;
      animation: drop 6s linear infinite;
    }
    @keyframes drop {
      0%   { opacity: 0; transform: translate(0px,0px) rotate(0deg); }
      45%  { opacity: 0; transform: translate(0px,0px) rotate(0deg); }
      48%  { opacity: 1; transform: translate(0px,0px) rotate(0deg); }
      70%  { opacity: 1; transform: translate(-10px,70px) rotate(-15deg); }
      90%  { opacity: 1; transform: translate(6px,120px) rotate(8deg); }
      100% { opacity: 0; transform: translate(0px,140px) rotate(0deg); }
    }
    .sparkle {
      opacity: 0;
      animation: twinkle 2s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>

  <!-- sparkle trail, barbie magic -->
  <circle class="sparkle" cx="150" cy="60" r="3" fill="#FFD700" style="animation-delay:0.2s"/>
  <circle class="sparkle" cx="300" cy="40" r="2.5" fill="#FF69B4" style="animation-delay:0.8s"/>
  <circle class="sparkle" cx="470" cy="70" r="3" fill="#FFD700" style="animation-delay:1.3s"/>
  <circle class="sparkle" cx="620" cy="35" r="2.5" fill="#FF69B4" style="animation-delay:0.5s"/>

  <!-- owl + letter fly across on a gentle swooping path -->
  <g>
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M -80,90 C 150,20 350,150 500,60 S 800,20 980,80" rotate="auto"/>

    <!-- dropped letter, positioned relative to owl -->
    <g id="letter" transform="translate(-6,10)">
      <rect x="-9" y="-6" width="18" height="12" rx="1.5" fill="#FFF8F0" stroke="#FF69B4" stroke-width="1"/>
      <path d="M-9,-6 L0,2 L9,-6" fill="none" stroke="#FF69B4" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.6" fill="#FFD700"/>
    </g>

    <!-- owl body -->
    <g>
      <!-- left wing -->
      <path class="wing-l" d="M-4,-2 Q-30,-4 -34,16 Q-16,10 -4,4 Z" fill="#F5F5F5" stroke="#E8E8E8" stroke-width="0.5"/>
      <!-- right wing -->
      <path class="wing-r" d="M4,-2 Q30,-4 34,16 Q16,10 4,4 Z" fill="#F5F5F5" stroke="#E8E8E8" stroke-width="0.5"/>
      <!-- body -->
      <ellipse cx="0" cy="4" rx="13" ry="16" fill="#FDFDFD" stroke="#EAEAEA" stroke-width="0.5"/>
      <!-- head -->
      <circle cx="0" cy="-10" r="11" fill="#FDFDFD" stroke="#EAEAEA" stroke-width="0.5"/>
      <!-- ear tufts -->
      <polygon points="-8,-18 -6,-24 -3,-17" fill="#FDFDFD"/>
      <polygon points="8,-18 6,-24 3,-17" fill="#FDFDFD"/>
      <!-- eyes -->
      <circle cx="-4" cy="-10" r="3.4" fill="#2b2b2b"/>
      <circle cx="4" cy="-10" r="3.4" fill="#2b2b2b"/>
      <circle cx="-3.3" cy="-10.8" r="0.9" fill="#fff"/>
      <circle cx="4.7" cy="-10.8" r="0.9" fill="#fff"/>
      <!-- beak -->
      <polygon points="-1.5,-6.5 1.5,-6.5 0,-3.5" fill="#FFD700"/>
      <!-- little pink bow, Barbie touch -->
      <polygon points="0,-20 -3,-23 0,-22 3,-23" fill="#FF69B4"/>
      <!-- tail -->
      <path d="M0,18 L-4,26 L4,26 Z" fill="#E8E8E8"/>
    </g>
  </g>
</svg>
